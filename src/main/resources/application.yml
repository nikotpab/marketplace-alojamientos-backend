spring:
  application:
    name: marketplace-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USUARIO_APP}
    password: ${DB_CONTRASENA_APP}
  flyway:
    user: ${DB_USUARIO_MIGRACION}
    password: ${DB_CONTRASENA_MIGRACION}
    default-schema: marketplace
    schemas: marketplace
  modulith:
    events:
      # La tabla event_publication la crea Flyway (V8): el usuario de la aplicación no tiene permisos de DDL.
      jdbc:
        schema-initialization:
          enabled: false
      # ADR-06: una entrega que se queda a medias, por ejemplo porque la aplicación se reinició,
      # se marca fallida al minuto y ProcesadorEventos la reintenta.
      staleness:
        published: 1m
        processing: 1m
        resubmitted: 1m
  # SCRUM-109 y SCRUM-110. Por defecto, Mailpit de desarrollo (compose.yaml). En producción, Gmail o Amazon SES por SMTP
  # con CORREO_SEGURO=true (README, "Correos").
  mail:
    host: ${CORREO_SERVIDOR:localhost}
    port: ${CORREO_PUERTO:1025}
    username: ${CORREO_USUARIO:}
    password: ${CORREO_CONTRASENA:}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": ${CORREO_SEGURO:false}
      "[mail.smtp.starttls.enable]": ${CORREO_SEGURO:false}
      "[mail.smtp.starttls.required]": ${CORREO_SEGURO:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  mvc:
    format:
      date: iso
  web:
    locale: es
    locale-resolver: fixed
  task:
    execution:
      pool:
        # RNF-08: hasta 5 exportaciones simultáneas, fuera del camino crítico.
        core-size: 5
        max-size: 5
    scheduling:
      pool:
        # El latido no debe esperar a que terminen las demás tareas programadas.
        size: 2

server:
  forward-headers-strategy: framework

logging:
  structured:
    format:
      console: logstash
    json:
      customizer: com.inversioneslr.marketplace.compartido.infraestructura.EnmascaradorLogs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  # ASR-05: el correo no es crítico; si el servidor SMTP cae, la API sigue sana.
  health:
    mail:
      enabled: false

# SCRUM-99: Swagger UI en /swagger-ui.html y la especificación en /v3/api-docs. Solo se documenta la API.
springdoc:
  paths-to-match: /api/v1/**

marketplace:
  pagos:
    proveedor: ${PAGOS_PROVEEDOR}
    stripe-clave-secreta: ${STRIPE_CLAVE_SECRETA:}
    stripe-metodo-pago: ${STRIPE_METODO_PAGO:pm_card_visa}
  jwt-secreto: ${JWT_SECRETO}
  correo:
    remitente: ${CORREO_REMITENTE:Marketplace de Alojamientos <no-responder@marketplace.local>}
    # Los enlaces de los correos llevan a pantallas del frontend.
    enlace-base: ${URL_PUBLICA:http://localhost:4200}
