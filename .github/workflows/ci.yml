name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Para volver a desplegar main sin un commit nuevo.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Incluye las pruebas de arquitectura.
  construir-y-probar:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarQube Cloud necesita el historial para saber qué código es nuevo.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify
      # Análisis en SonarQube Cloud con la cobertura de JaCoCo. Sin el secreto (PR de Dependabot), se omite.
      # Espera el quality gate y falla si queda en ERROR, así que bloquea el merge.
      - if: env.SONAR_TOKEN != ''
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.qualitygate.wait=true
      # Reporte de cobertura de JaCoCo, descargable desde la ejecución del CI.
      - uses: actions/upload-artifact@v7
        with:
          name: cobertura-jacoco
          path: target/site/jacoco
      # Contrato OpenAPI versionado, descargable para comparar entre builds.
      - uses: actions/upload-artifact@v7
        with:
          name: openapi-contrato
          path: docs/openapi.json
      # Si una prueba falla, sus reportes quedan descargables para revisar la causa.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reportes-pruebas
          path: |
            target/surefire-reports
            target/failsafe-reports

  # Bloquea credenciales en el repositorio.
  credenciales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Cada push a main que pasa las pruebas publica la imagen en ECR, con el commit como etiqueta, y la despliega
  # en la EC2 por SSM. GitHub entra a AWS por OIDC, sin llaves guardadas. Las variables del repositorio salen del stack
  # de deploy/aws/despliegue.yaml; sin ellas el job no corre. Ver "Despliegue en AWS" en el README.
  desplegar:
    needs: [construir-y-probar, credenciales]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_ROL_DESPLIEGUE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: despliegue-api
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROL_DESPLIEGUE }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0
      # La EC2 es ARM (t4g). El Dockerfile compila en la plataforma del runner; solo la imagen final se emula.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/marketplace-api:${{ github.sha }}
          cache-from: type=gha,scope=marketplace-api
          cache-to: type=gha,mode=max,scope=marketplace-api
      - name: Desplegar en la EC2
        env:
          DOCUMENTO: ${{ vars.AWS_DOCUMENTO_DESPLIEGUE }}
          INSTANCIA: ${{ vars.AWS_INSTANCIA }}
        run: |
          comando=$(aws ssm send-command --document-name "$DOCUMENTO" --instance-ids "$INSTANCIA" \
            --parameters "etiqueta=$GITHUB_SHA" --comment "marketplace-api $GITHUB_SHA" \
            --query Command.CommandId --output text)
          estado=Pending
          for _ in $(seq 90); do
            sleep 10
            estado=$(aws ssm get-command-invocation --command-id "$comando" --instance-id "$INSTANCIA" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$estado" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$comando" --instance-id "$INSTANCIA" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Resultado del despliegue: $estado"
          test "$estado" = Success
