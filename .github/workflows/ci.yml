name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Incluye las pruebas de arquitectura (EC-28).
  construir-y-probar:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarQube Cloud necesita el historial para saber qué código es nuevo.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify
      # SCRUM-104: análisis en SonarQube Cloud con la cobertura de JaCoCo. Sin el secreto (PR de Dependabot), se omite.
      - if: env.SONAR_TOKEN != ''
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
      # SCRUM-100: reporte de cobertura de JaCoCo, descargable desde la ejecución del CI.
      - uses: actions/upload-artifact@v7
        with:
          name: cobertura-jacoco
          path: target/site/jacoco
      # SCRUM-102: si una prueba falla, sus reportes quedan descargables para revisar la causa.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reportes-pruebas
          path: |
            target/surefire-reports
            target/failsafe-reports

  # Bloquea credenciales en el repositorio (EC-27).
  credenciales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
